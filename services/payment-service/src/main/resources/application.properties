# Server
server.port=${SERVER_PORT:50051}
spring.application.name=payment-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:secureshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# gRPC port
grpc.port=${GRPC_PORT:50051}

# Logging
logging.level.com.secureshop=INFO

# Keep the application alive — gRPC server runs in background threads
# Without this Spring Boot exits immediately after startup
spring.main.web-application-type=none
